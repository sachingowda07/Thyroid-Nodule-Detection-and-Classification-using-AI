{% extends "base.html" %}
{% block content %}

<style>
.upload-wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 40px auto 70px auto;
    padding: 35px;
    border-radius: 30px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 15px 40px rgba(0,0,0,0.18);
    animation: fadeSlide 0.7s ease;
}

.section-title {
    font-size: 28px;
    font-weight: 800;
    color: #003366;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    font-weight: 600;
    color: #003366;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid #cfd6e0;
    font-size: 16px;
}

.input-group input:focus {
    border-color: #4d8bff;
}

/* Upload Box */
.upload-box {
    border: 3px dashed #4287f5;
    background: #f1f6ff;
    border-radius: 25px;
    padding: 45px;
    text-align: center;
    transition: 0.2s;
    cursor: pointer;
}

.upload-box:hover {
    background: #e6eeff;
}

.upload-box img {
    width: 70px;
    margin-bottom: 10px;
    opacity: 0.8;
}

#preview-image {
    display: none;
    width: 100%;
    max-width: 400px;
    margin-top: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.upload-btn {
    background: #ff4757;
    color: white;
    padding: 14px 35px;
    border-radius: 30px;
    font-size: 18px;
    border: none;
    margin-top: 20px;
    transition: 0.25s;
}

.upload-btn:hover {
    background: #e63d4d;
}

@keyframes fadeSlide {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
}
</style>

<div class="upload-wrapper">

    <h2 class="section-title">Patient Details</h2>

    <form method="POST" enctype="multipart/form-data">

        <!-- Patient Form -->
        <div class="input-group">
            <label>Patient Name</label>
            <input type="text" name="patient_name" required>
        </div>

        <div class="input-group">
            <label>Age</label>
            <input type="number" name="age" min="1" max="120" required>
        </div>

        <div class="input-group">
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" name="phone" maxlength="10" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>


        <h2 class="section-title" style="margin-top:40px;">Upload Ultrasound Image</h2>

        <!-- Upload Box -->
        <label for="image-upload">
            <div class="upload-box" id="drop-area">
                <img src="https://cdn-icons-png.flaticon.com/512/545/545682.png" />
                <h3>Click or Drag & Drop an Image</h3>
                <p style="color:#777;">Accepted: PNG • JPG • JPEG</p>
            </div>
        </label>

        <input type="file" id="image-upload" name="image" accept="image/*" style="display:none;" required>

        <center>
            <img id="preview-image">
        </center>

        <center>
            <button type="submit" class="upload-btn" id="submit-btn" style="display:none;">
                Analyze Image
            </button>
        </center>

    </form>
</div>

<script>
let uploadInput = document.getElementById("image-upload");
let preview = document.getElementById("preview-image");
let dropArea = document.getElementById("drop-area");
let submitBtn = document.getElementById("submit-btn");

uploadInput.addEventListener("change", function(event) {
    let file = event.target.files[0];
    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    submitBtn.style.display = "inline-block";
});

// Drag & Drop
dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.style.background = "#e1eaff";
});
dropArea.addEventListener("dragleave", () => {
    dropArea.style.background = "#f1f6ff";
});
dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    uploadInput.files = e.dataTransfer.files;
    preview.src = URL.createObjectURL(e.dataTransfer.files[0]);
    preview.style.display = "block";
    submitBtn.style.display = "inline-block";
});
</script>

{% endblock %}
