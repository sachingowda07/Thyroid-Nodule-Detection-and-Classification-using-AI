<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - ThyroidDetect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: #eef3f8;
}

.wrapper {
    display: flex;
    height: 100vh;
}

.left {
    flex: 1.2;
    background: url('/static/images/hero2.jpg') no-repeat center center;
    background-size: cover;
    border-right: 1px solid rgba(0,0,0,0.1);
}

.right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f9fc;
}

.form-box {
    width: 80%;
    max-width: 420px;
    padding: 35px;
    border-radius: 15px;
    background: white;
    border: 1px solid #e0e6ef;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    color: #0A66C2;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

label {
    font-weight: 500;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #c8d3e0;
}

button {
    width: 100%;
    padding: 14px;
    background: #0A66C2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
}
</style>
</head>

<body>
<div class="wrapper">
    <div class="left"></div>

    <div class="right">
        <div class="form-box">

            <h2>Create Account</h2>
            <p class="subtitle">Join ThyroidDetect Portal</p>

            {% if error %}
                <p style="color:red; text-align:center;">{{ error }}</p>
            {% endif %}

            <form method="POST" action="/register">

                <label>Full Name</label>
                <input type="text" name="name" required>

                <label>Date of Birth</label>
                <input type="date" name="dob" required>

                <label>Age</label>
                <input type="number" name="age" required>

                <label>Email</label>
                <input type="email" name="email" required>

                <label>Phone Number</label>
                <input type="text" name="phone" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <button type="submit">Register</button>

                <p style="text-align:center; margin-top:15px;">
                    Already have an account?
                    <a href="/login">Login here</a>
                </p>

            </form>
        </div>
    </div>
</div>
</body>
</html>
